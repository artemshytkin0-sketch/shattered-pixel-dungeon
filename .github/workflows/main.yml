name: Build Shattered Pixel Dungeon iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build iOS IPA
        run: chmod +x gradlew && ./gradlew ios:createIPA

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-ios
          path: ios/build/robovm/*.ipa
          if-no-files-found: warn
