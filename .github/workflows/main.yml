name: Build Shattered Pixel Dungeon iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build IPA for later signing
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :ios:createIPA \
            -Probovm.iosSkipSigning=true \
            -Probovm.archs=arm64 \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain 2>&1 | tee ios-build.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-ios
          path: ios/build/robovm/*.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-ios-log
          path: ios-build.log
          if-no-files-found: warn
